<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debit Note - MarketJS</title>
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body class="dashboard-page">
    <div id="app-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;gap:12px;flex-wrap:wrap">
            <input type="text" id="search-input" placeholder="🔍  Cari reff no atau messrs..."
            style="padding:10px 16px;border:1px solid var(--border-color);border-radius:10px;font-size:0.88rem;width:300px;outline:none;font-family:inherit">
            <a href="/finance/debit-note/tambah"
            style="display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--primary);color:white;border-radius:10px;text-decoration:none;font-weight:700;font-size:0.88rem">
            <i class="ti ti-plus"></i> Tambah Debit Note
        </a>
    </div>

    <div class="bento-item" style="padding:0;overflow:hidden">
        <div style="overflow-x:auto">
            <table class="data-table" style="margin:0;min-width:900px">
                <thead>
                    <tr style="background:var(--bg-main)">
                        <th style="padding:14px 18px;width:44px">#</th>
                        <th style="padding:14px 18px">REFF NO</th>
                        <th style="padding:14px 18px">MESSRS</th>
                        <th style="padding:14px 18px;text-align:center">ITEMS</th>
                        <th style="padding:14px 18px;text-align:right">TOTAL</th>
                        <th style="padding:14px 18px">DATE</th>
                        <th style="padding:14px 18px;width:150px;text-align:center">AKSI</th>
                    </tr>
                </thead>
                <tbody id="dn-tbody">
                    <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--border-color);background:var(--bg-main)">
            <span id="pagination-info" style="font-size:0.8rem;color:var(--text-muted)">-</span>
            <div id="pagination-controls" style="display:flex;gap:6px"></div>
        </div>
    </div>

    <div id="delete-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;justify-content:center;align-items:center">
        <div style="background:#fff;border-radius:16px;padding:32px;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.18)">
            <div style="font-size:48px;margin-bottom:10px">🗑️</div>
            <h3 style="margin:0 0 8px;color:#0f172a">Hapus Debit Note?</h3>
            <p style="color:#64748b;font-size:0.88rem;margin-bottom:24px">Data <b id="delete-name"></b> beserta seluruh itemnya akan dihapus permanen.</p>
            <div style="display:flex;gap:10px;justify-content:center">
                <button onclick="closeDeleteModal()" style="padding:10px 24px;border:1px solid var(--border-color);border-radius:8px;background:#fff;font-weight:600;cursor:pointer;font-family:inherit">Batal</button>
                <button onclick="confirmDelete()" style="padding:10px 24px;background:#ef4444;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit">Hapus</button>
            </div>
        </div>
    </div>
</div>

<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
    let allData = [], filtered = [], currentPage = 1;
    const PER_PAGE = 10;
    let deleteId = null;

    function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmtDate(str) {
        if (!str) return '-';
        const s = str.slice(0,10).split('-');
        return `${s[2]}/${s[1]}/${s[0]}`;
    }
    function fmtCur(val, cur) {
        const n = parseFloat(val) || 0;
        return cur === 'IDR' ? 'Rp ' + n.toLocaleString('id-ID', {maximumFractionDigits:0}) : '$ ' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:4});
    }

    function loadData() {
        fetch('/api/debitnote')
        .then(r => r.json())
        .then(data => { allData = data; filtered = data; currentPage = 1; renderTable(); })
        .catch(() => {
            document.getElementById('dn-tbody').innerHTML =
            '<tr><td colspan="7" style="text-align:center;padding:40px;color:#ef4444">Gagal memuat data.</td></tr>';
        });
    }

    function renderTable() {
        const tbody = document.getElementById('dn-tbody');
        const total = filtered.length;
        const totalPages = Math.ceil(total / PER_PAGE) || 1;
        currentPage = Math.min(currentPage, totalPages);
        const start = (currentPage - 1) * PER_PAGE;
        const pageData = filtered.slice(start, start + PER_PAGE);

        if (!total) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Tidak ada data.</td></tr>';
            document.getElementById('pagination-info').textContent = '0 data';
            document.getElementById('pagination-controls').innerHTML = '';
            return;
        }

        tbody.innerHTML = pageData.map((d, i) => `
            <tr>
            <td style="padding:13px 18px;color:var(--text-muted);font-size:0.82rem">${start+i+1}</td>
            <td style="padding:13px 18px;font-weight:800;color:var(--primary)">${esc(d.reff_no || '-')}</td>
            <td style="padding:13px 18px;font-weight:600">${esc(d.messrs || '-')}</td>
            <td style="padding:13px 18px;text-align:center">
            <span style="background:var(--primary-light);color:var(--primary);padding:2px 10px;border-radius:20px;font-weight:700;font-size:0.78rem">${d.item_count || 0}</span>
            </td>
            <td style="padding:13px 18px;text-align:right;font-weight:700;color:#2563eb">${fmtCur(d.currency === 'IDR' ? d.total_amount_idr : d.total_amount, d.currency)}</td>
            <td style="padding:13px 18px;font-size:0.85rem;color:var(--text-muted)">${fmtDate(d.date)}</td>
            <td style="padding:13px 18px;text-align:center">
            <div style="display:flex;gap:6px;justify-content:center">
            <a href="/finance/debit-note/detail?id=${d.id_debitnote}" title="Kelola Item"
            style="display:inline-flex;padding:6px 10px;background:#f5f3ff;color:#7c3aed;border-radius:7px;text-decoration:none"><i class="ti ti-list-details" style="font-size:13px"></i></a>
            <a href="/finance/debit-note/edit?id=${d.id_debitnote}" title="Edit"
            style="display:inline-flex;padding:6px 10px;background:#eef2ff;color:var(--primary);border-radius:7px;text-decoration:none"><i class="ti ti-edit" style="font-size:13px"></i></a>
            <button onclick="openDeleteModal(${d.id_debitnote}, '${esc(d.reff_no || d.messrs || '')}')" title="Hapus"
            style="padding:6px 10px;background:#fef2f2;color:#ef4444;border:none;border-radius:7px;cursor:pointer;font-family:inherit"><i class="ti ti-trash" style="font-size:13px"></i></button>
            </div>
            </td>
            </tr>`).join('');

        document.getElementById('pagination-info').textContent = `Menampilkan ${start+1}–${Math.min(start+pageData.length,total)} dari ${total} data`;
        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        const ctrl = document.getElementById('pagination-controls');
        if (totalPages <= 1) { ctrl.innerHTML = ''; return; }
        const btnStyle = a => `padding:6px 12px;border-radius:7px;border:1px solid ${a?'var(--primary)':'var(--border-color)'};background:${a?'var(--primary)':'#fff'};color:${a?'#fff':'var(--text-muted)'};font-size:0.8rem;font-weight:600;cursor:pointer;font-family:inherit`;
        let html = `<button style="${btnStyle(false)}" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}><i class="ti ti-chevron-left"></i></button>`;
        for (let i = 1; i <= totalPages; i++) html += `<button style="${btnStyle(i===currentPage)}" onclick="goPage(${i})">${i}</button>`;
        html += `<button style="${btnStyle(false)}" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}><i class="ti ti-chevron-right"></i></button>`;
        ctrl.innerHTML = html;
    }

    function goPage(p) { const tp = Math.ceil(filtered.length/PER_PAGE)||1; if (p<1||p>tp) return; currentPage = p; renderTable(); }

    function openDeleteModal(id, name) { deleteId = id; document.getElementById('delete-name').textContent = name; document.getElementById('delete-modal').style.display = 'flex'; }
    function closeDeleteModal() { deleteId = null; document.getElementById('delete-modal').style.display = 'none'; }
    function confirmDelete() {
        fetch('/api/debitnote/' + deleteId, { method: 'DELETE' })
        .then(r => r.json())
        .then(data => { if (data.success) { closeDeleteModal(); loadData(); } else alert('❌ Gagal: ' + (data.error || 'Unknown error')); })
        .catch(err => alert('❌ Kesalahan jaringan: ' + err.message));
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        document.getElementById('search-input').addEventListener('input', function () {
            const q = this.value.toLowerCase();
            filtered = allData.filter(d => (d.reff_no||'').toLowerCase().includes(q) || (d.messrs||'').toLowerCase().includes(q));
            currentPage = 1; renderTable();
        });
    });
</script>
</body>
</html>
