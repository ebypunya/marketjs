<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Debit Note - MarketJS</title>
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        .fg { display:flex;flex-direction:column }
        .fl { font-size:0.78rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px }
        .fi { padding:10px 13px;border:1px solid var(--border-color);border-radius:9px;font-size:0.88rem;font-family:inherit;color:var(--text-main);background:var(--bg-main);outline:none;width:100%;box-sizing:border-box }
        .fi:focus { border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,0.08) }
        .grid3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px }
    </style>
</head>
<body class="dashboard-page">
    <div id="app-content">
        <div class="bento-item" style="width:100%;box-sizing:border-box">
            <div id="alert-box" style="display:none;padding:12px 16px;border-radius:8px;margin-bottom:20px;font-size:0.88rem;font-weight:600"></div>

            <div class="grid3" style="margin-bottom:14px">
                <div class="fg"><label class="fl">Reff No</label><input type="text" id="f-reff_no" class="fi"></div>
                <div class="fg"><label class="fl">Debit Note Date <span style="color:#ef4444">*</span></label><input type="date" id="f-date" class="fi"></div>
                <div class="fg">
                    <label class="fl">Messrs <span style="color:#ef4444">*</span></label>
                    <select id="f-messrs" class="fi"><option value="">-- Pilih Customer --</option></select>
                </div>
            </div>

            <div class="grid3" style="margin-bottom:14px">
                <div class="fg"><label class="fl">ATTN</label><input type="text" id="f-attn" class="fi"></div>
                <div class="fg">
                    <label class="fl">Currency <span style="color:#ef4444">*</span></label>
                    <select id="f-currency" class="fi"><option value="USD">USD</option><option value="IDR">IDR</option></select>
                </div>
                <div class="fg"><label class="fl">Delivery Note No</label><input type="text" id="f-delivery_note_no" class="fi"></div>
            </div>

            <div style="display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:stretch;margin-bottom:28px">
                <div style="width:320px;flex-shrink:0;border:1px solid var(--border-color);border-radius:10px;overflow:hidden">
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--primary-light);border-bottom:1px solid var(--border-color)">
                        <button type="button" onclick="calPrev()" style="background:none;border:none;cursor:pointer;color:var(--primary);font-size:1rem"><i class="ti ti-chevron-left"></i></button>
                        <span id="cal-label" style="font-weight:700;color:var(--primary)">—</span>
                        <button type="button" onclick="calNext()" style="background:none;border:none;cursor:pointer;color:var(--primary);font-size:1rem"><i class="ti ti-chevron-right"></i></button>
                    </div>
                    <div id="cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);padding:4px;gap:2px"></div>
                </div>
                <div style="border:1px solid var(--border-color);border-radius:10px;background:#f8fafc;display:flex;flex-direction:column;justify-content:center;padding:16px 20px">
                    <div id="rate-info-empty" style="text-align:center;color:var(--text-muted);font-size:0.83rem">Pilih tanggal kurs yang bertanda biru.</div>
                    <div id="rate-info-data" style="display:none">
                        <div style="font-size:0.75rem;color:var(--text-muted)">Tanggal: <b id="ri-date" style="color:var(--text-main)">—</b></div>
                        <div style="margin-top:8px;display:flex;gap:10px">
                            <div><span style="font-size:0.7rem;color:#16a34a;font-weight:700">SELL</span><br><b id="ri-sell">—</b></div>
                            <div><span style="font-size:0.7rem;color:#2563eb;font-weight:700">BUY</span><br><b id="ri-buy">—</b></div>
                        </div>
                    </div>
                </div>
            </div>

            <div style="display:flex;gap:10px">
                <a href="/finance/debit-note" style="padding:11px 24px;border:1px solid var(--border-color);border-radius:9px;font-weight:600;font-size:0.88rem;text-decoration:none;color:var(--text-main);font-family:inherit"><i class="ti ti-arrow-left"></i> Batal</a>
                <button onclick="submitForm()" id="btn-submit" style="padding:11px 28px;background:var(--primary);color:white;border:none;border-radius:9px;font-weight:700;font-size:0.88rem;cursor:pointer;font-family:inherit"><i class="ti ti-device-floppy"></i> Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/sidebar.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        const dnId = new URLSearchParams(window.location.search).get('id');
        if (!dnId) window.location.href = '/finance/debit-note';

        let allRates = [], ratesByDate = {}, selectedRate = null, calYear = 0, calMonth = 0, selectedDateStr = null;
        const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        const DAYS = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

        document.addEventListener('DOMContentLoaded', async () => {
            const now = new Date();
            calYear = now.getFullYear();
            calMonth = now.getMonth();
            await Promise.all([loadCustomers(), loadRates()]);
            await loadData();
            renderCalendar();
        });

        async function loadCustomers() {
            const data = await fetch('/api/customers').then(r => r.json());
            const sel = document.getElementById('f-messrs');
            data.forEach(c => { const o = document.createElement('option'); o.value = c.name; o.textContent = c.name; sel.appendChild(o); });
        }

        function pad(n){ return String(n).padStart(2,'0'); }
        async function loadRates() {
            allRates = await fetch('/api/rates').then(r => r.json());
            ratesByDate = {};
            allRates.forEach(r => { const k = r.created_at.slice(0,10); if (!ratesByDate[k]) ratesByDate[k] = r; });
        }

        async function loadData() {
            try {
                const d = await fetch('/api/debitnote/' + dnId).then(r => r.json());
                if (d.error) { showAlert('❌ Data tidak ditemukan.', 'error'); return; }
                document.getElementById('f-reff_no').value = d.reff_no || '';
                document.getElementById('f-date').value = d.date ? d.date.slice(0,10) : '';
                document.getElementById('f-messrs').value = d.messrs || '';
                document.getElementById('f-attn').value = d.attn || '';
                document.getElementById('f-currency').value = d.currency || 'USD';
                document.getElementById('f-delivery_note_no').value = d.delivery_note_no || '';

                const matched = allRates.find(r => String(r.id) === String(d.rate_id));
                if (matched) {
                    const ds = matched.created_at.slice(0,10);
                    const p = ds.split('-');
                    calYear = parseInt(p[0]); calMonth = parseInt(p[1]) - 1;
                    selectedRate = matched; selectedDateStr = ds;
                    document.getElementById('rate-info-empty').style.display = 'none';
                    document.getElementById('rate-info-data').style.display = '';
                    document.getElementById('ri-date').textContent = ds;
                    document.getElementById('ri-sell').textContent = 'Rp ' + Number(matched.sell_rate).toLocaleString('id-ID');
                    document.getElementById('ri-buy').textContent  = 'Rp ' + Number(matched.buy_rate).toLocaleString('id-ID');
                    renderCalendar();
                }
            } catch(e) { showAlert('❌ Gagal memuat data.', 'error'); }
        }

        function renderCalendar() {
            document.getElementById('cal-label').textContent = `${MONTHS[calMonth]} ${calYear}`;
            let html = DAYS.map(d => `<div style="text-align:center;font-size:0.7rem;font-weight:700;color:var(--text-muted);padding:4px 0">${d}</div>`).join('');
            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
            for (let i=0;i<firstDay;i++) html += `<div></div>`;
            for (let d=1; d<=daysInMonth; d++) {
                const ds = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
                const hasRate = !!ratesByDate[ds];
                const isSel = ds === selectedDateStr;
                const style = `text-align:center;padding:6px 2px;font-size:0.8rem;border-radius:6px;cursor:${hasRate?'pointer':'default'};
                background:${isSel?'var(--primary)':hasRate?'#eff6ff':'transparent'};color:${isSel?'#fff':hasRate?'#1d4ed8':'#94a3b8'};font-weight:${hasRate?'800':'400'}`;
                html += `<div style="${style}" ${hasRate?`onclick="selectDate('${ds}')"`:''}>${d}</div>`;
            }
            document.getElementById('cal-grid').innerHTML = html;
        }
        function calPrev(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
        function calNext(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
        function selectDate(ds) {
            const rate = ratesByDate[ds];
            if (!rate) return;
            selectedRate = rate; selectedDateStr = ds;
            renderCalendar();
            document.getElementById('rate-info-empty').style.display = 'none';
            document.getElementById('rate-info-data').style.display = '';
            document.getElementById('ri-date').textContent = ds;
            document.getElementById('ri-sell').textContent = 'Rp ' + Number(rate.sell_rate).toLocaleString('id-ID');
            document.getElementById('ri-buy').textContent  = 'Rp ' + Number(rate.buy_rate).toLocaleString('id-ID');
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alert-box');
            box.style.display = 'block';
            box.style.background = type === 'success' ? '#f0fdf4' : '#fef2f2';
            box.style.color = type === 'success' ? '#16a34a' : '#dc2626';
            box.textContent = msg;
            box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        function gv(id) { return document.getElementById(id).value.trim(); }

        function submitForm() {
            if (!gv('f-date')) { showAlert('❌ Debit Note Date wajib diisi.', 'error'); return; }
            if (!gv('f-messrs')) { showAlert('❌ Messrs wajib dipilih.', 'error'); return; }
            if (!selectedRate) { showAlert('❌ Pilih rate/kurs terlebih dahulu.', 'error'); return; }

            const payload = {
                reff_no: gv('f-reff_no') || null,
                attn: gv('f-attn') || null,
                date: gv('f-date'),
                messrs: gv('f-messrs'),
                currency: gv('f-currency'),
                rate_id: selectedRate.id,
                kurs: selectedRate.sell_rate,
                delivery_note_no: gv('f-delivery_note_no') || null,
            };

            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> Menyimpan...';

            fetch('/api/debitnote/' + dnId, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showAlert('✅ Debit Note berhasil diperbarui!', 'success');
                    setTimeout(() => { window.location.href = '/finance/debit-note/detail?id=' + dnId; }, 1000);
                } else {
                    showAlert('❌ Gagal: ' + (data.error || 'Unknown error'), 'error');
                    btn.disabled = false; btn.innerHTML = '<i class="ti ti-device-floppy"></i> Simpan Perubahan';
                }
            })
            .catch(err => {
                showAlert('❌ Kesalahan server: ' + err.message, 'error');
                btn.disabled = false; btn.innerHTML = '<i class="ti ti-device-floppy"></i> Simpan Perubahan';
            });
        }
    </script>
</body>
</html>
